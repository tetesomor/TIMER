<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>timer</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="background-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Focus">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --accent: #ff4d4d;
    --bg: #0a0a0a;
    --surface: #131313;
    --line: #262626;
    --text: #f5f5f5;
    --text-dim: #6b6b6b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Neue Montreal', 'Helvetica Neue', -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(32px, env(safe-area-inset-top)) 20px max(60px, env(safe-area-inset-bottom));
  }

  .wrap {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .wordmark {
    font-size: 13px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 500;
  }

  .mode-toggle {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 3px;
  }

  .mode-toggle button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    font-family: inherit;
  }

  .mode-toggle button.active {
    background: var(--accent);
    color: #0a0a0a;
    font-weight: 600;
  }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px;
  }

  .card-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ---------- Timer ---------- */
  .timer-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px 28px;
  }

  .ring-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin-bottom: 24px;
  }

  .ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }

  .ring-bg { fill: none; stroke: var(--line); stroke-width: 3; }
  .ring-fg {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .time-display {
    font-size: 52px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .phase-label {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  .timer-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .btn {
    font-family: inherit;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 11px 20px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn:hover { border-color: var(--text-dim); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0a;
    font-weight: 600;
    padding: 11px 28px;
  }

  .btn-primary:hover { opacity: 0.88; }

  .timer-settings {
    display: flex;
    gap: 24px;
  }

  .field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .field label {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .field input[type="number"] {
    width: 56px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    text-align: center;
    padding: 6px 4px;
    border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }

  .field input[type="number"]:focus { outline: none; border-color: var(--accent); }

  /* ---------- Metronome ---------- */
  .metro-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .bpm-value {
    font-size: 32px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    min-width: 64px;
  }

  .bpm-unit {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  .metro-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
  }

  .pulse-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.06s, transform 0.06s;
  }

  .pulse-dot.beat {
    background: var(--accent);
    transform: scale(1.4);
  }

  .metro-actions { display: flex; gap: 10px; align-items: center; }

  /* ---------- Noise ---------- */
  .noise-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .noise-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    transition: border-color 0.2s;
  }

  .noise-row.on { border-color: var(--accent); }

  .noise-toggle {
    width: 36px;
    height: 20px;
    border-radius: 100px;
    background: var(--line);
    border: none;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .noise-toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform 0.2s, background 0.2s;
  }

  .noise-row.on .noise-toggle { background: var(--accent); }
  .noise-row.on .noise-toggle::after { transform: translateX(16px); background: #0a0a0a; }

  .noise-name {
    font-size: 13px;
    width: 56px;
    flex-shrink: 0;
  }

  .noise-row input[type="range"] { flex: 1; }

  /* ---------- Accent picker ---------- */
  .accent-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.15s;
  }

  .swatch.selected {
    border-color: var(--text);
    transform: scale(1.12);
  }

  /* ---------- Compact / widget mode ---------- */
  .compact-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    gap: 20px;
  }

  .compact-ring { width: 200px; height: 200px; position: relative; }
  .compact-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }

  .compact-time {
    font-size: 44px;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
  }

  .hidden { display: none !important; }

  footer {
    margin-top: 8px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-align: center;
  }

  @media (max-width: 380px) {
    .ring-wrap { width: 200px; height: 200px; }
    .time-display { font-size: 42px; }
  }
</style>
</head>
<body>

<div class="wrap" id="fullView">

  <div class="header">
    <div class="wordmark">Focus</div>
    <div class="mode-toggle">
      <button class="active" id="btnFull">Full</button>
      <button id="btnCompact">Widget</button>
    </div>
  </div>

  <!-- Pomodoro -->
  <div class="card timer-card">
    <div class="ring-wrap">
      <svg viewBox="0 0 240 240">
        <circle class="ring-bg" cx="120" cy="120" r="110"></circle>
        <circle class="ring-fg" id="ringFg" cx="120" cy="120" r="110" stroke-dasharray="691.15" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-center">
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="phase-label" id="phaseLabel">Focus</div>
      </div>
    </div>

    <div class="timer-controls">
      <button class="btn btn-primary" id="timerToggle">Start</button>
      <button class="btn" id="timerReset">Reset</button>
      <button class="btn" id="timerSkip">Skip</button>
    </div>

    <div class="timer-settings">
      <div class="field">
        <label>Focus</label>
        <input type="number" id="focusMin" value="25" min="1" max="120">
      </div>
      <div class="field">
        <label>Break</label>
        <input type="number" id="breakMin" value="5" min="1" max="60">
      </div>
    </div>
  </div>

  <!-- Metronome -->
  <div class="card">
    <div class="card-label">
      <span>Metronome</span>
      <span class="pulse-dot" id="pulseDot"></span>
    </div>
    <div class="metro-row">
      <div class="bpm-value" id="bpmValue">100</div>
      <div class="bpm-unit">bpm</div>
      <input type="range" id="bpmSlider" min="40" max="220" value="100">
    </div>
    <div class="metro-bottom">
      <button class="btn" id="tapTempo">Tap tempo</button>
      <div class="metro-actions">
        <button class="btn btn-primary" id="metroToggle">Start</button>
      </div>
    </div>
  </div>

  <!-- Noise -->
  <div class="card">
    <div class="card-label"><span>Ambient noise</span></div>
    <div class="noise-list">
      <div class="noise-row" data-noise="white">
        <button class="noise-toggle"></button>
        <div class="noise-name">White</div>
        <input type="range" min="0" max="100" value="60">
      </div>
      <div class="noise-row" data-noise="brown">
        <button class="noise-toggle"></button>
        <div class="noise-name">Brown</div>
        <input type="range" min="0" max="100" value="60">
      </div>
      <div class="noise-row" data-noise="pink">
        <button class="noise-toggle"></button>
        <div class="noise-name">Pink</div>
        <input type="range" min="0" max="100" value="60">
      </div>
    </div>
  </div>

  <!-- Accent -->
  <div class="card">
    <div class="card-label"><span>Accent colour</span></div>
    <div class="accent-row" id="accentRow"></div>
  </div>

  <footer>Runs entirely in-browser. Save this file to use it offline, anytime.</footer>
</div>

<!-- Compact / widget view -->
<div class="compact-wrap hidden" id="compactView">
  <div class="mode-toggle" style="align-self: center;">
    <button id="btnFull2">Full</button>
    <button class="active" id="btnCompact2">Widget</button>
  </div>
  <div class="compact-ring">
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="92" fill="none" stroke="var(--line)" stroke-width="3"></circle>
      <circle id="ringFgCompact" cx="100" cy="100" r="92" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="578.05" stroke-dashoffset="0" transform="rotate(-90 100 100)"></circle>
    </svg>
    <div class="ring-center">
      <div class="compact-time" id="compactTime">25:00</div>
      <div class="phase-label" id="compactPhase">Focus</div>
    </div>
  </div>
  <div class="timer-controls">
    <button class="btn btn-primary" id="compactToggle">Start</button>
    <button class="btn" id="compactReset">Reset</button>
  </div>
</div>

<script>
// ================= State =================
const accentColors = {
  red: '#ff4d4d',
  orange: '#ff9142',
  yellow: '#f2d94e',
  green: '#4ade80',
  lightblue: '#38bdf8',
  blue: '#4d7fff',
  purple: '#a855f7',
  pink: '#f472b6'
};

let focusSeconds = 25 * 60;
let breakSeconds = 5 * 60;
let remaining = focusSeconds;
let totalForPhase = focusSeconds;
let isFocusPhase = true;
let timerRunning = false;
let timerInterval = null;

const RING_CIRC = 2 * Math.PI * 110;
const RING_CIRC_COMPACT = 2 * Math.PI * 92;

// ================= Accent picker =================
const accentRow = document.getElementById('accentRow');
Object.entries(accentColors).forEach(([name, hex], i) => {
  const sw = document.createElement('div');
  sw.className = 'swatch' + (name === 'red' ? ' selected' : '');
  sw.style.background = hex;
  sw.dataset.name = name;
  sw.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    sw.classList.add('selected');
    document.documentElement.style.setProperty('--accent', hex);
  });
  accentRow.appendChild(sw);
});

// ================= View toggle =================
const fullView = document.getElementById('fullView');
const compactView = document.getElementById('compactView');

function showFull() {
  fullView.classList.remove('hidden');
  compactView.classList.add('hidden');
}
function showCompact() {
  fullView.classList.add('hidden');
  compactView.classList.remove('hidden');
}
document.getElementById('btnCompact').addEventListener('click', showCompact);
document.getElementById('btnFull2').addEventListener('click', showFull);
document.getElementById('btnCompact2').addEventListener('click', showCompact);
document.getElementById('btnFull').addEventListener('click', showFull);

// ================= Timer =================
const timeDisplay = document.getElementById('timeDisplay');
const phaseLabel = document.getElementById('phaseLabel');
const ringFg = document.getElementById('ringFg');
const compactTime = document.getElementById('compactTime');
const compactPhase = document.getElementById('compactPhase');
const ringFgCompact = document.getElementById('ringFgCompact');
const timerToggle = document.getElementById('timerToggle');
const compactToggle = document.getElementById('compactToggle');

ringFg.style.strokeDasharray = RING_CIRC;
ringFgCompact.style.strokeDasharray = RING_CIRC_COMPACT;

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function renderTimer() {
  const label = formatTime(remaining);
  timeDisplay.textContent = label;
  compactTime.textContent = label;
  const phase = isFocusPhase ? 'Focus' : 'Break';
  phaseLabel.textContent = phase;
  compactPhase.textContent = phase;

  const progress = 1 - (remaining / totalForPhase);
  const offset = RING_CIRC * progress;
  const offsetCompact = RING_CIRC_COMPACT * progress;
  ringFg.style.strokeDashoffset = offset;
  ringFgCompact.style.strokeDashoffset = offsetCompact;

  const label2 = timerRunning ? 'Pause' : 'Start';
  timerToggle.textContent = label2;
  compactToggle.textContent = label2;
}

function tickTimer() {
  remaining -= 1;
  if (remaining <= 0) {
    isFocusPhase = !isFocusPhase;
    totalForPhase = isFocusPhase ? focusSeconds : breakSeconds;
    remaining = totalForPhase;
    playChime();
  }
  renderTimer();
}

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(tickTimer, 1000);
  renderTimer();
}

function pauseTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  renderTimer();
}

function toggleTimer() {
  timerRunning ? pauseTimer() : startTimer();
}

function resetTimer() {
  pauseTimer();
  isFocusPhase = true;
  totalForPhase = focusSeconds;
  remaining = focusSeconds;
  renderTimer();
}

function skipPhase() {
  isFocusPhase = !isFocusPhase;
  totalForPhase = isFocusPhase ? focusSeconds : breakSeconds;
  remaining = totalForPhase;
  renderTimer();
}

document.getElementById('timerToggle').addEventListener('click', toggleTimer);
document.getElementById('compactToggle').addEventListener('click', toggleTimer);
document.getElementById('timerReset').addEventListener('click', resetTimer);
document.getElementById('compactReset').addEventListener('click', resetTimer);
document.getElementById('timerSkip').addEventListener('click', skipPhase);

document.getElementById('focusMin').addEventListener('change', (e) => {
  const v = Math.max(1, Math.min(120, parseInt(e.target.value) || 25));
  focusSeconds = v * 60;
  e.target.value = v;
  if (isFocusPhase && !timerRunning) { totalForPhase = focusSeconds; remaining = focusSeconds; renderTimer(); }
});
document.getElementById('breakMin').addEventListener('change', (e) => {
  const v = Math.max(1, Math.min(60, parseInt(e.target.value) || 5));
  breakSeconds = v * 60;
  e.target.value = v;
  if (!isFocusPhase && !timerRunning) { totalForPhase = breakSeconds; remaining = breakSeconds; renderTimer(); }
});

renderTimer();

// ================= Audio context (shared) =================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playChime() {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = 880;
  osc.type = 'sine';
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.85);
}

// ================= Metronome =================
let bpm = 100;
let metroRunning = false;
let metroTimeoutId = null;
let nextBeatTime = 0;
let metroLookaheadTimer = null;

const bpmSlider = document.getElementById('bpmSlider');
const bpmValue = document.getElementById('bpmValue');
const metroToggle = document.getElementById('metroToggle');
const pulseDot = document.getElementById('pulseDot');

bpmSlider.addEventListener('input', (e) => {
  bpm = parseInt(e.target.value);
  bpmValue.textContent = bpm;
});

function scheduleClick(time) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = 1000;
  osc.type = 'square';
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(0.25, time + 0.001);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.03);
  osc.connect(gain).connect(ctx.destination);
  osc.start(time);
  osc.stop(time + 0.04);

  const delay = (time - ctx.currentTime) * 1000;
  setTimeout(() => {
    pulseDot.classList.add('beat');
    setTimeout(() => pulseDot.classList.remove('beat'), 90);
  }, Math.max(0, delay));
}

function metroScheduler() {
  const ctx = getAudioCtx();
  while (nextBeatTime < ctx.currentTime + 0.1) {
    scheduleClick(nextBeatTime);
    nextBeatTime += 60 / bpm;
  }
  metroLookaheadTimer = setTimeout(metroScheduler, 25);
}

function startMetro() {
  if (metroRunning) return;
  metroRunning = true;
  const ctx = getAudioCtx();
  nextBeatTime = ctx.currentTime + 0.05;
  metroScheduler();
  metroToggle.textContent = 'Stop';
}

function stopMetro() {
  metroRunning = false;
  clearTimeout(metroLookaheadTimer);
  metroToggle.textContent = 'Start';
}

metroToggle.addEventListener('click', () => {
  metroRunning ? stopMetro() : startMetro();
});

// Tap tempo
let tapTimes = [];
document.getElementById('tapTempo').addEventListener('click', () => {
  const now = performance.now();
  tapTimes.push(now);
  if (tapTimes.length > 5) tapTimes.shift();
  if (tapTimes.length >= 2) {
    const intervals = [];
    for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i - 1]);
    const avgMs = intervals.reduce((a, b) => a + b, 0) / intervals.length;
    const newBpm = Math.round(60000 / avgMs);
    if (newBpm >= 40 && newBpm <= 220) {
      bpm = newBpm;
      bpmSlider.value = bpm;
      bpmValue.textContent = bpm;
    }
  }
  clearTimeout(window._tapReset);
  window._tapReset = setTimeout(() => { tapTimes = []; }, 2000);
});

// ================= Noise generators =================
const noiseNodes = {}; // name -> {source, gain}

function createNoiseBuffer(ctx, type) {
  const bufferSize = 2 * ctx.sampleRate;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);

  if (type === 'white') {
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  } else if (type === 'pink') {
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886*b0 + white*0.0555179;
      b1 = 0.99332*b1 + white*0.0750759;
      b2 = 0.96900*b2 + white*0.1538520;
      b3 = 0.86650*b3 + white*0.3104856;
      b4 = 0.55000*b4 + white*0.5329522;
      b5 = -0.7616*b5 - white*0.0168980;
      const out = b0+b1+b2+b3+b4+b5+b6+white*0.5362;
      b6 = white*0.115926;
      data[i] = out * 0.11;
    }
  } else if (type === 'brown') {
    let lastOut = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      lastOut = (lastOut + (0.02 * white)) / 1.02;
      data[i] = lastOut * 3.5;
    }
  }
  return buffer;
}

function startNoise(name) {
  const ctx = getAudioCtx();
  const buffer = createNoiseBuffer(ctx, name);
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;
  const gain = ctx.createGain();
  const row = document.querySelector(`.noise-row[data-noise="${name}"]`);
  const sliderVal = row.querySelector('input[type="range"]').value;
  gain.gain.value = sliderVal / 100 * 0.5;
  source.connect(gain).connect(ctx.destination);
  source.start();
  noiseNodes[name] = { source, gain };
}

function stopNoise(name) {
  const node = noiseNodes[name];
  if (node) {
    node.source.stop();
    delete noiseNodes[name];
  }
}

document.querySelectorAll('.noise-row').forEach(row => {
  const name = row.dataset.noise;
  const toggleBtn = row.querySelector('.noise-toggle');
  const slider = row.querySelector('input[type="range"]');

  toggleBtn.addEventListener('click', () => {
    const isOn = row.classList.toggle('on');
    if (isOn) startNoise(name); else stopNoise(name);
  });

  slider.addEventListener('input', (e) => {
    if (noiseNodes[name]) {
      noiseNodes[name].gain.gain.value = e.target.value / 100 * 0.5;
    }
  });
});

// ================= PWA install + service worker =================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
